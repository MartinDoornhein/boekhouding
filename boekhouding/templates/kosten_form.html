{% extends "base.html" %}
{% block title %}Kosten{% endblock %}
{% block content %}
<div class="head"><h1>{{ 'Kosten bewerken' if eid else 'Kosten inboeken' }}</h1></div>
<form method="post" enctype="multipart/form-data" class="card" id="expform">
  <div class="grid2">
    <label>Datum (factuur/bon)<input type="date" name="date" value="{{ e.date or today }}" required></label>
    <label>Leverancier<input name="supplier" value="{{ e.supplier or '' }}" autofocus></label>
    <label>Omschrijving<input name="description" value="{{ e.description or '' }}"></label>
    <label>Categorie
      <input name="category" list="cats" value="{{ e.category or '' }}" placeholder="Kies of typ een categorie">
      <datalist id="cats">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist></label>
    <label>Btw-soort
      <select name="vat_type" id="vat_type">
        {% for k, v in EXPENSE_VAT_TYPES.items() %}<option value="{{ k }}" {{ 'selected' if e.vat_type == k }}>{{ v }}</option>{% endfor %}
      </select></label>
    <label id="rate_wrap">Btw-tarief
      <select name="vat_rate" id="vat_rate">
        {% for r in ['21','9','0'] %}<option value="{{ r }}" {{ 'selected' if (e.vat_rate|string) == r }}>{{ r }}%</option>{% endfor %}
      </select></label>
    <label><span id="total_label">Totaalbedrag incl. btw</span>
      <input name="total" id="total" value="{{ e.total or '' }}" inputmode="decimal" placeholder="0,00" required></label>
    <label id="ovr_wrap">Btw-bedrag <span class="muted">(alleen invullen als het afwijkt van de bon)</span>
      <input name="vat_override" id="vat_override" value="{{ e.vat_override or '' }}" inputmode="decimal" placeholder="automatisch"></label>
    <label>Bon / factuur (pdf of foto)
      <input type="file" name="receipt" accept=".pdf,image/*">
      {% if e.receipt_id %}<span class="small"><a href="{{ url_for('kosten.kosten_bon', eid=eid) }}" target="_blank">Huidige bon bekijken</a>
        · <label style="display:inline;font-weight:400"><input type="checkbox" name="remove_receipt" value="1"> verwijderen</label></span>{% endif %}
    </label>
  </div>
  <div class="note" id="calc" style="margin-top:14px"></div>
  <div class="actions" style="margin-top:16px">
    <button class="primary">Opslaan</button>
    {% if not eid %}<button name="again" value="1">Opslaan en volgende</button>{% endif %}
    <a class="btn" href="{{ url_for('kosten.kosten') }}">Annuleren</a>
  </div>
</form>
{% if eid %}
<form method="post" action="{{ url_for('kosten.kosten_verwijderen', eid=eid) }}" onsubmit="return confirm('Deze kostenpost en de bon verwijderen?')">
  <button class="danger">Verwijderen</button></form>
{% endif %}
<script>
(function () {
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString('nl-NL', {style: 'currency', currency: 'EUR'});
  const num = v => { v = (v || '').replace(/[€\s]/g, ''); if (!v) return null; if (v.includes(',')) v = v.replace(/\./g, '').replace(',', '.');
                     const n = parseFloat(v); return isNaN(n) ? null : Math.round(n * 100); };
  function calc() {
    const t = $('vat_type').value, r = +$('vat_rate').value, total = num($('total').value), ovr = num($('vat_override').value);
    $('rate_wrap').classList.toggle('hide', t === 'geen');
    $('ovr_wrap').classList.toggle('hide', t === 'geen');
    $('total_label').textContent = t === 'nl' ? 'Totaalbedrag incl. btw' : (t === 'geen' ? 'Totaalbedrag' : 'Factuurbedrag (zonder btw)');
    if (total === null) { $('calc').textContent = 'Vul het bedrag in.'; return; }
    let excl, vat, msg;
    if (t === 'nl') { vat = ovr ?? Math.round(total * r / (100 + r)); excl = total - vat;
      msg = `Excl. btw ${fmt(excl/100)} · aftrekbare btw ${fmt(vat/100)} (rubriek 5b)`; }
    else if (t === 'geen') { msg = `Kosten ${fmt(total/100)} · geen btw-aftrek`; }
    else { vat = ovr ?? Math.round(total * r / 100);
      const rub = t === 'eu_verlegd' ? '4b' : '4a';
      msg = `Kosten ${fmt(total/100)} · verlegde btw ${fmt(vat/100)}: verschuldigd in rubriek ${rub} én aftrekbaar in 5b (per saldo € 0)`; }
    $('calc').textContent = msg;
  }
  $('expform').addEventListener('input', calc); $('expform').addEventListener('change', calc); calc();
})();
</script>
{% endblock %}
