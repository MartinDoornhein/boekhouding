[project]
name = "boekhouding"
version = "1.0.0"
description = "Eenvoudige lokale boekhouding voor een eenmanszaak: facturen, kosten, btw-aangifte en jaaroverzicht."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
